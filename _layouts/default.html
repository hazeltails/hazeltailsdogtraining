<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    {% if page.title %}
      {{ page.title }} | Hazel Tails Dog Training
    {% else %}
      Hazel Tails Dog Training
    {% endif %}
  </title>

  {% if page.description %}
    <meta
      name="description"
      content="{{ page.description }}"
    >
  {% endif %}

  <link
    rel="stylesheet"
    href="{{ '/assets/css/style.css' | relative_url }}"
  >

</head>

<body>

  {% include header.html %}

  <main>
    {{ content }}
  </main>

  {% include footer.html %}

</body>

</html>
